<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invoices · Admin · Cursive</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/pdtracker/pdtracker.css?v=2026053002" />
  <style>
    body { background:#f8fafc; margin:0; color:#0f172a; font-family:-apple-system,"Segoe UI",Roboto,sans-serif; }
    main { max-width:1200px; margin:0 auto; padding:20px; }
    .panel { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:18px; margin-bottom:14px; }
    h1 { font-size:20px; margin:0; }
    input, select { padding:8px 10px; border:1px solid #d0d7de; border-radius:6px; font-size:13px; }
    button { padding:8px 14px; border-radius:6px; border:none; cursor:pointer; font-weight:600; font-size:13px; }
    .b-primary { background:#1f6feb; color:#fff; }
    .b-outline { background:#fff; color:#1f6feb; border:1px solid #1f6feb; }
    .b-danger { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }
    table { width:100%; border-collapse:collapse; }
    th { background:#f8fafc; padding:10px 8px; text-align:left; font-size:11px; color:#475467; text-transform:uppercase; letter-spacing:.4px; border-bottom:2px solid #e2e8f0; }
    td { padding:12px 8px; font-size:13px; border-bottom:1px solid #f1f5f9; }
    tr:hover td { background:#f8fafc; }
    .toast { position:fixed; right:20px; bottom:20px; background:#16a34a; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; font-weight:600; z-index:200; }
    .toast.err { background:#dc2626; }
    .hidden { display:none !important; }
    .email-chip { background:#f1f5f9; color:#475467; padding:5px 10px; border-radius:6px; font-size:12.5px; font-weight:600; }
    .summary-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
    .summary-card { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:14px; }
    .summary-card .lbl { font-size:11px; color:#64748b; text-transform:uppercase; font-weight:700; letter-spacing:.4px; margin-bottom:4px; }
    .summary-card .val { font-size:20px; font-weight:800; color:#0f172a; }
    .summary-card.total .val { color:#1f6feb; }
    @media (max-width:800px) { .summary-row { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>

<header class="topbar">
  <div class="brand" style="cursor:default;">
    <div class="brand-box" aria-label="cursive logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 17 9 11 13 15 21 6"/>
        <polyline points="15 6 21 6 21 12"/>
      </svg>
    </div>
    <div>
      <div class="brand-wordmark">cursive<sup>&reg;</sup></div>
      <div class="nav-sub">Invoices · Admin</div>
    </div>
  </div>
  <div class="topbar-right" style="display:flex;align-items:center;gap:10px;">
    <span id="emailChip" class="email-chip hidden"></span>
    <a href="/admin/quotations/" class="b-outline" style="padding:7px 12px;border-radius:6px;font-weight:600;font-size:13px;text-decoration:none;">📋 Quotations</a>
    <button id="signOutBtn" class="hidden b-danger" style="padding:7px 12px;">Logout</button>
  </div>
</header>

<main>
  <div id="loginPanel" class="panel hidden" style="max-width:400px;margin:60px auto;">
    <h1 style="text-align:center;">🔒 Admin Login</h1>
    <label style="display:block;font-size:12px;color:#475467;font-weight:700;margin:10px 0 4px;text-transform:uppercase;">Email</label>
    <input id="loginEmail" type="text" placeholder="admin@cursive.world" style="width:100%;" />
    <label style="display:block;font-size:12px;color:#475467;font-weight:700;margin:10px 0 4px;text-transform:uppercase;">Password</label>
    <input id="loginPass" type="password" placeholder="••••••••" style="width:100%;" />
    <div id="loginErr" style="color:#dc2626;font-size:12px;margin-top:8px;display:none;"></div>
    <button id="loginBtn" class="b-primary" style="width:100%;margin-top:14px;padding:10px;">Sign in</button>
  </div>

  <div id="app" class="hidden">
    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <h1>💼 Invoices (Accounting)</h1>
        <div style="display:flex;gap:8px;align-items:center;">
          <input id="searchBox" type="text" placeholder="Search invoice # / customer / employee..." style="width:260px;" />
          <select id="periodFilter" style="width:140px;">
            <option value="all">All time</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">This year</option>
          </select>
          <select id="empFilter" style="width:160px;">
            <option value="__all__">All employees</option>
          </select>
        </div>
      </div>
      <div class="summary-row" id="summaryRow" style="margin-top:14px;">
        <div class="summary-card"><div class="lbl">Total invoices</div><div class="val" id="sumCount">—</div></div>
        <div class="summary-card total"><div class="lbl">Total collected</div><div class="val" id="sumTotal">—</div></div>
        <div class="summary-card"><div class="lbl">GST collected</div><div class="val" id="sumGst">—</div></div>
        <div class="summary-card"><div class="lbl">Subtotal (pre-GST)</div><div class="val" id="sumSub">—</div></div>
      </div>
      <div id="listWrap" style="margin-top:14px;"></div>
    </div>
  </div>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm";
const SUPABASE_URL = "https://bttppihskbfmxwujyztj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ooT6WLYpHh6NOVWJBH7ECw_E78_gwqQ";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, storageKey:"pd_tracker_auth" }});

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = p => "₹" + (Number(p)/100).toLocaleString("en-IN", { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" }) : "";

function toast(msg, isErr) { const t = document.createElement("div"); t.className="toast"+(isErr?" err":""); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3500); }

let _session = null;
let _all = [];

async function refresh() {
  const { data:{ session } } = await sb.auth.getSession();
  _session = session;
  if (session) {
    $("#loginPanel").classList.add("hidden");
    $("#app").classList.remove("hidden");
    $("#emailChip").textContent = session.user.email;
    $("#emailChip").classList.remove("hidden");
    $("#signOutBtn").classList.remove("hidden");
    await load();
  } else {
    $("#loginPanel").classList.remove("hidden");
    $("#app").classList.add("hidden");
    $("#emailChip").classList.add("hidden");
    $("#signOutBtn").classList.add("hidden");
  }
}

$("#loginBtn").addEventListener("click", async () => {
  const email = $("#loginEmail").value.trim();
  const password = $("#loginPass").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $("#loginErr").textContent = error.message; $("#loginErr").style.display = "block"; return; }
  $("#loginErr").style.display = "none";
  await refresh();
});
$("#signOutBtn").addEventListener("click", async () => { await sb.auth.signOut(); await refresh(); });
$("#loginPass").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });

async function callFn(name, body) {
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method: "POST",
    headers: { "Content-Type":"application/json", "Authorization":"Bearer "+_session.access_token, "apikey":SUPABASE_ANON_KEY },
    body: JSON.stringify(body || {}),
  });
  return await r.json();
}

async function load() {
  $("#listWrap").innerHTML = `<div style="padding:20px;text-align:center;color:#94a3b8;">Loading...</div>`;
  const j = await callFn("admin-invoices", { op:"list" });
  if (!j.ok) { $("#listWrap").innerHTML = `<div style="color:#dc2626;">Error: ${esc(j.error)}</div>`; return; }
  _all = j.invoices || [];
  render();
}

function filtered() {
  const q = ($("#searchBox").value || "").trim().toLowerCase();
  const period = $("#periodFilter").value;
  const empSel = ($("#empFilter")?.value || "__all__");
  const now = Date.now();
  return _all.filter(inv => {
    if (period !== "all") {
      const days = Number(period);
      const cutoff = now - days*86400000;
      if (new Date(inv.created_at).getTime() < cutoff) return false;
    }
    if (empSel === "__none__") { if (inv.employee_code) return false; }
    else if (empSel !== "__all__") { if ((inv.employee_code || "") !== empSel) return false; }
    if (!q) return true;
    return (inv.invoice_number || "").toLowerCase().includes(q) ||
           (inv.customer_name || "").toLowerCase().includes(q) ||
           (inv.customer_email || "").toLowerCase().includes(q) ||
           (inv.quote_number || "").toLowerCase().includes(q) ||
           (inv.employee_code || "").toLowerCase().includes(q) ||
           (inv.employee_name || "").toLowerCase().includes(q);
  });
}

function refreshEmpFilterOptions() {
  const sel = document.getElementById("empFilter");
  if (!sel) return;
  const codes = Array.from(new Set(_all.map(x => (x.employee_code || "").trim()).filter(Boolean))).sort();
  const hasBlank = _all.some(x => !x.employee_code);
  const prev = sel.value || "__all__";
  let html = `<option value="__all__">All employees</option>`;
  if (hasBlank) html += `<option value="__none__">(no code)</option>`;
  for (const c of codes) html += `<option value="${c.replace(/"/g,"&quot;")}">${c.replace(/</g,"&lt;")}</option>`;
  sel.innerHTML = html;
  const valid = ["__all__","__none__", ...codes];
  sel.value = valid.includes(prev) ? prev : "__all__";
}

// Live employee code lookup helper (used by inline edit)
const _empLookupCache = new Map();
async function empLookup(code) {
  const v = String(code || "").trim();
  if (!v) return null;
  if (_empLookupCache.has(v)) return _empLookupCache.get(v);
  const j = await callFn("admin-employees", { op:"lookup", code: v });
  const hit = (j && j.ok) ? j.employee : null;
  _empLookupCache.set(v, hit);
  return hit;
}

function render() {
  refreshEmpFilterOptions();
  const rows = filtered();
  // Summary
  let sub = 0, gst = 0, total = 0;
  for (const inv of rows) { sub += Number(inv.subtotal_paise||0); gst += Number(inv.gst_paise||0); total += Number(inv.total_paise||0); }
  $("#sumCount").textContent = rows.length;
  $("#sumTotal").textContent = fmt(total);
  $("#sumGst").textContent = fmt(gst);
  $("#sumSub").textContent = fmt(sub);

  if (rows.length === 0) { $("#listWrap").innerHTML = `<div style="padding:30px;text-align:center;color:#94a3b8;">No invoices found.</div>`; return; }
  let html = `<table><thead><tr>
    <th>Invoice #</th><th>Customer</th><th>Employee</th><th>Ref Quote</th><th>Total</th><th>Payment ID</th><th>Date</th><th>Emailed</th><th></th>
  </tr></thead><tbody>`;
  for (const inv of rows) {
    const empChip = inv.employee_code
      ? `<span style="display:inline-block;padding:2px 8px;background:#eef2ff;color:#3730a3;border:1px solid #c7d2fe;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.3px;">Emp: ${esc(inv.employee_code)}${inv.employee_name?` (${esc(inv.employee_name)})`:""}</span>`
      : `<span style="color:#94a3b8;font-size:11px;">—</span>`;
    html += `<tr>
      <td><b>${esc(inv.invoice_number)}</b></td>
      <td>${esc(inv.customer_name)}${inv.customer_email?`<br><small style="color:#64748b;">${esc(inv.customer_email)}</small>`:""}</td>
      <td>
        <div data-emp-cell="${inv.id}">${empChip}</div>
        <button data-emp-edit="${inv.id}" style="margin-top:4px;background:transparent;border:1px dashed #94a3b8;color:#475569;padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer;">✎ Set / change</button>
      </td>
      <td>${esc(inv.quote_number || "—")}</td>
      <td><b>${fmt(inv.total_paise)}</b></td>
      <td><code style="font-family:monospace;font-size:11px;color:#64748b;">${esc((inv.payment_id||"—").slice(0,18))}</code></td>
      <td style="font-size:12px;color:#64748b;">${fmtDate(inv.created_at)}</td>
      <td style="font-size:12px;color:${inv.emailed_at?"#16a34a":"#94a3b8"};">${inv.emailed_at?"✓ "+fmtDate(inv.emailed_at):"Not sent"}</td>
      <td style="white-space:nowrap;">
        ${(function () {
          const invUrl = `/invoice/?t=${esc(inv.share_token)}`;
          const dlUrl  = invUrl + "&print=1";
          const phone  = (inv.customer_phone || inv.mobile || "").replace(/\D/g, "");
          const waNum  = phone.length === 10 ? "91" + phone : phone;
          const waMsg  = encodeURIComponent(`Hi ${inv.customer_name || "there"}, your invoice ${inv.invoice_number} from Cursive Private Limited — ${location.origin}${invUrl}`);
          const waLink = waNum ? `https://wa.me/${waNum}?text=${waMsg}` : `https://wa.me/?text=${waMsg}`;
          return `
            <a href="${invUrl}" target="_blank" class="b-outline" style="padding:5px 10px;font-size:11.5px;border-radius:5px;text-decoration:none;" title="View invoice">👁 View</a>
            <a href="${dlUrl}" target="_blank" class="b-outline" style="padding:5px 10px;font-size:11.5px;margin-left:4px;border-radius:5px;text-decoration:none;background:#f0fdf4;color:#166534;border-color:#bbf7d0;" title="Download / Print">⬇ Download</a>
            <a href="${waLink}" target="_blank" rel="noopener" class="b-outline" style="padding:5px 10px;font-size:11.5px;margin-left:4px;border-radius:5px;text-decoration:none;background:#dcfce7;color:#065f46;border-color:#86efac;" title="Share via WhatsApp">💬 Share</a>
            <button class="b-primary email-btn" data-id="${inv.id}" style="padding:5px 10px;font-size:11.5px;margin-left:4px;">📧 Email</button>
          `;
        })()}
      </td>
    </tr>`;
  }
  html += `</tbody></table>`;
  $("#listWrap").innerHTML = html;
  // Wire "Set / change" inline emp editors
  document.querySelectorAll("[data-emp-edit]").forEach(b => {
    b.addEventListener("click", () => openEmpEditor(Number(b.dataset.empEdit)));
  });
  document.querySelectorAll(".email-btn").forEach(b => {
    b.addEventListener("click", async () => {
      const id = Number(b.dataset.id);
      if (!confirm("Send invoice email to customer?")) return;
      b.disabled = true; b.textContent = "Sending...";
      const j = await callFn("admin-invoices", { op:"email", id });
      if (j.ok) { toast("✓ Emailed"); await load(); }
      else { toast(j.error || "Failed", true); b.disabled = false; b.textContent = "📧 Email"; }
    });
  });
}

$("#searchBox").addEventListener("input", render);
$("#periodFilter").addEventListener("change", render);
$("#empFilter").addEventListener("change", render);

// Inline employee editor with live lookup UX (✓ NAME / ✗ unknown code)
function openEmpEditor(invId) {
  const inv = _all.find(x => Number(x.id) === Number(invId));
  if (!inv) return;
  const cell = document.querySelector(`[data-emp-cell="${invId}"]`);
  if (!cell) return;
  const currentCode = inv.employee_code || "";
  cell.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:4px;">
      <input type="text" id="empIn_${invId}" value="${esc(currentCode)}" placeholder="e.g. PR73" style="width:110px;padding:5px 8px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;" autocomplete="off" />
      <div id="empName_${invId}" style="font-size:11px;font-weight:700;min-height:14px;"></div>
      <div style="display:flex;gap:4px;">
        <button data-emp-save="${invId}" style="background:#1f6feb;color:#fff;border:0;border-radius:4px;padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;">Save</button>
        <button data-emp-cancel="${invId}" style="background:#f1f5f9;color:#475467;border:0;border-radius:4px;padding:3px 8px;font-size:11px;cursor:pointer;">Cancel</button>
      </div>
    </div>`;
  const input = document.getElementById(`empIn_${invId}`);
  const label = document.getElementById(`empName_${invId}`);
  let resolved = { code: "", name: "" };
  let timer = null;
  const showState = async (val) => {
    const v = (val || "").trim();
    if (!v) { label.textContent = ""; label.style.color = ""; resolved = { code:"", name:"" }; return; }
    label.textContent = "…"; label.style.color = "#64748b";
    const hit = await empLookup(v);
    if (hit && hit.name) {
      label.textContent = `✓ ${hit.name}${hit.is_active === false ? " (inactive)" : ""}`;
      label.style.color = "#16a34a";
      resolved = { code: v, name: hit.name };
    } else {
      label.textContent = "✗ unknown code";
      label.style.color = "#dc2626";
      resolved = { code: "", name: "" };
    }
  };
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => showState(input.value), 300); });
  input.focus();
  input.select();
  if (currentCode) showState(currentCode);
  cell.parentElement.querySelector(`[data-emp-save="${invId}"]`).addEventListener("click", async () => {
    const v = input.value.trim();
    const payload = { op: "update_employee", id: invId, employee_code: v || null, employee_name: (v && v === resolved.code) ? resolved.name : null };
    const j = await callFn("admin-invoices", payload);
    if (!j.ok) { toast(j.error || "Save failed", true); return; }
    toast(v ? "✓ Employee updated" : "✓ Employee cleared");
    // Update local cache without full reload
    inv.employee_code = j.employee_code || null;
    inv.employee_name = j.employee_name || null;
    render();
  });
  cell.parentElement.querySelector(`[data-emp-cancel="${invId}"]`).addEventListener("click", render);
}

refresh();
</script>

<script src="/admin/admin-forgot-btn.js?v=2026082102" defer></script>
</body></html>
